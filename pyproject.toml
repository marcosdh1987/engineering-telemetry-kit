[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engineering-telemetry-kit"
dynamic = ["version"]
description = "Privacy-first Engineering Delivery telemetry kit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcos Díaz Herrera" }]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.16,<0.17",
]

[project.scripts]
engobs = "engobs.cli:main"

[tool.hatch.version]
path = "src/engobs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engobs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["engobs"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S = bandit-style security rules (see .github/standards.md).
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests drive git via subprocess with fixed argv.
"tests/*" = ["S101", "S603", "S607"]
# subprocess without shell=True, fixed argv, git binary resolved from PATH by design.
"src/engobs/git/context.py" = ["S603", "S607"]
# runs the user-supplied verification command (no shell), by design.
"src/engobs/commands/verify.py" = ["S603"]
# git hook wrappers must be executable (0o755).
"src/engobs/git/hooks.py" = ["S103"]
# urlopen target is the user-configured endpoint; scheme is not attacker-controlled.
"src/engobs/transport/http.py" = ["S310"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
packages = ["engobs"]
